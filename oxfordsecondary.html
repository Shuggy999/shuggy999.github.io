      A5.AUDIO_URL_BUILDER = function (id, format) {
        var cdn =
          id.indexOf("r5_") === 0
            ? "https://lnr-runtime-assets.s3-website-eu-west-1.amazonaws.com"
            : "https://assets-runtime-production-oxed-oup.avallain.net";
        return cdn + "/" + id + "." + format;
      };

      A5.VIDEO_URL_BUILDER = function (id, format) {
        if (format == "hls") {
          return ("https://assets-runtime-production-oxed-oup.avallain.net/" + id + "/hls_playlist.m3u8");
        } else {
          return ("https://assets-runtime-production-oxed-oup.avallain.net/" + id + "." + format);
        }
      };

      // Get the book parameter from the URL or default to 925
      const urlParams = new URLSearchParams(window.location.search);
      let book = urlParams.get("book") || "925";

      // Construct the script URL dynamically
      let scriptUrl = `https://cdn.oxfordsecondary.co.uk/products/${book}/content/data.js`;

      // Function to dynamically load the script
      function loadScript(url) {
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.src = url;
        script.async = true; // Ensures non-blocking execution
        script.onerror = function () {
          console.error("Failed to load script:", url);
        };
        document.head.appendChild(script); // Append to head for earlier execution
      }

      // Load the script
      loadScript(scriptUrl);
      
    </script>
